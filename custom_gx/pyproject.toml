[project]
name = "welch-style"
version = "0.1.0"
description = "Shared Welch Labs primitives and styling for manimgx scenes"
requires-python = ">=3.13,<3.14"
dependencies = ["manimgx>=0.1.1", "numpy>=2", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "welch_animation.py", "welch_axes.py", "welch_geometry.py", "welch_paths.py", "welch_scene.py", "welch_storyboard.py",
    "welch_style.py", "welch_surface.py", "welch_text.py",
]
