[project]
name = "welch-style"
version = "0.1.0"
description = "Shared Welch Labs look (palette, font, background) for manimgx scenes"
requires-python = ">=3.13,<3.14"
dependencies = ["manimgx>=0.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["welch_style.py"]
