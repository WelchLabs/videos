  <text class="cls-4" transform="translate(70.02 54.47)"><tspan x="0" y="0">ANimate row of attention moving to </tspan><tspan x="0" y="2.64">heatmap on top of images. Repeat this </tspan><tspan x="0" y="5.28">idea for the next two rows, interactive </tspan><tspan x="0" y="7.92">with Claude on how we want to do this </tspan><tspan x="0" y="10.56">exactly. Hmm we could also do this </tspan><tspan x="0" y="13.2">overlay in Premiere/illustrator. We’ll </tspan><tspan x="0" y="15.84">see. Will need to change attention heads </tspan><tspan x="0" y="18.48">as we go. Oh shit and then for P47 we </tspan><tspan x="0" y="21.12">can animate the pattern and videos f </tspan><tspan x="0" y="23.76">rames through diffusion, that will be </tspan><tspan x="0" y="26.4">cool!</tspan></text>
