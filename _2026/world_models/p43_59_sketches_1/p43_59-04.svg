  <text class="cls-6" transform="translate(116.19 42.22)"><tspan x="0" y="0">Frames get stacked into 3D block of pixels, zoom </tspan><tspan x="0" y="2.64">into a “spacetime patch” of 8x8x4 of pixels. From </tspan><tspan x="0" y="5.28">here the script says that each spacetime patch is </tspan><tspan x="0" y="7.92">mapped to a token, and the tokens are passed </tspan><tspan x="0" y="10.56">into our model. Would like to figure out someway </tspan><tspan x="0" y="13.2">to show this. After this want to animatbe back to </tspan><tspan x="0" y="15.84">4x3 grid of frames. </tspan></text>
