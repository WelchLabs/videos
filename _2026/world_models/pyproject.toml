[project]
name = "world-models-scenes"
version = "0.1.0"
description = "manimgx scenes for the world models video"
# manimgx only ships for Python 3.13+, while the repo root is pinned to 3.12 for
# manimgl, so this folder is its own uv project.
requires-python = ">=3.13,<3.14"
dependencies = [
    "manimgx>=0.1.1",
    "numpy>=2.4.3",
    "pillow>=12.2.0",
    "welch-style",
]

[tool.uv]
# Same reason as the repo root: external Dropbox volume, hardlinks never work.
link-mode = "copy"
package = false

[tool.uv.sources]
# Shared Welch Labs palette and font: from welch_style import *
welch-style = { path = "../../custom_gx", editable = true }
